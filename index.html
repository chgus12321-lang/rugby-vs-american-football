<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUGBY / FOOTBALL</title><link rel="stylesheet" href="style.css"></head><body><main id="start" class="screen active"><div class="eyebrow">THE FIELD • INTERACTIVE SPORTS GUIDE</div><h1><em>RUGBY</em><small>VS</small><strong>FOOTBALL</strong></h1><div class="ball" id="hybrid"></div><button id="begin">PRESS ANY KEY <span>아무 키나 눌러 시작하세요 →</span></button></main><main id="stadium" class="screen"><header><button data-back="start">← 시작</button><b>THE FIELD</b><div><button data-game="rugby">럭비 패스 게임</button><button data-game="football">미식축구 패스 게임</button></div></header><div class="arena" id="arena"></div><footer>선수 또는 경기장 시설을 선택하세요 · 왼쪽 RUGBY UNION / 오른쪽 AMERICAN FOOTBALL</footer></main><main id="detail" class="screen"><header><button data-back="stadium">← 경기장</button><b>FIELD GUIDE</b></header><article id="article"></article></main><main id="game" class="screen"><header><button data-back="stadium">← 경기장</button><b id="gameTitle"></b><button id="reset">다시 시작</button></header><section class="gamewrap"><div class="hud"><span id="score"></span><span id="message" aria-live="polite"></span><span id="route"></span></div><canvas id="field" width="1000" height="540" aria-label="패스 게임 경기장"></canvas><div class="power"><i id="meter"></i></div><div class="controls"><b id="powerText">강도 0 / 100</b><span>방향키: 조준 이동 · 스페이스: 누르는 동안 충전, 떼면 패스</span></div><div class="touch"><button data-move="left">←</button><button data-move="up">↑</button><button data-move="down">↓</button><button data-move="right">→</button><button id="throw">누르고 떼기 · PASS</button></div></section></main><script src="app.js"></script></body></html>
